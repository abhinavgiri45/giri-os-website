<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>

    <linearGradient id="iconViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C77DFF" />
      <stop offset="50%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#5A189A" />
    </linearGradient>

    <linearGradient id="iconRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="bgPlate" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#161F38" />
      <stop offset="60%" stop-color="#0C101F" />
      <stop offset="100%" stop-color="#060810" />
    </radialGradient>
  </defs>

  <!-- App Icon Squircle Rounded Container -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bgPlate)" stroke="#223152" stroke-width="2.5" />

  <!-- Center Icon Content (Center at 128, 128) -->
  <g transform="translate(0, 0)">
    <!-- Ambient Internal Backlight -->
    <circle cx="128" cy="128" r="70" fill="url(#iconViolet)" opacity="0.18" filter="url(#iconGlow)" />

    <!-- Outer Orbital Ring -->
    <g transform="rotate(-28 128 128)">
      <ellipse cx="128" cy="128" rx="98" ry="34" fill="none" stroke="url(#iconRing)" stroke-width="3.2" stroke-dasharray="190 18 30 10" />
      <circle cx="226" cy="128" r="4.5" fill="#00F0FF" filter="url(#iconGlow)" />
      <circle cx="226" cy="128" r="2" fill="#FFFFFF" />
    </g>

    <!-- Geometric Letter 'G' -->
    <path d="M 188,96 
             C 173,64 139,46 104,51 
             C 63,57 34,94 34,136 
             C 34,182 68,215 116,215 
             C 164,215 197,183 197,141 
             L 197,129 
             L 116,129 
             L 116,152 
             L 170,152 
             C 167,170 145,190 115,190 
             C 81,190 58,165 58,134 
             C 58,103 80,77 112,73 
             C 136,70 159,81 171,100 
             Z" 
          fill="url(#iconBlue)" 
          filter="url(#iconGlow)" />

    <!-- Forefront Orbital Arc Crossing -->
    <g transform="rotate(-28 128 128)">
      <path d="M 75,154 C 100,165 155,165 190,152" fill="none" stroke="#00F0FF" stroke-width="3.8" stroke-linecap="round" />
    </g>
  </g>
</svg>
