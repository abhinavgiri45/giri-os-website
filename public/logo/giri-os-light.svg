<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="100%" height="100%">
  <!-- GIRI OS — Version For Dark Backgrounds -->
  <!-- Crisp White Wordmark | Vibrant Electric Blue & Violet Window Panes -->
  <defs>
    <style>
      .brand-text {
        font-family: "Inter", "Space Grotesk", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 800;
        font-size: 72px;
        letter-spacing: 5px;
        fill: #FFFFFF;
      }
      .tagline-text {
        font-family: "Inter", "Space Grotesk", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 600;
        font-size: 13.5px;
        letter-spacing: 5.5px;
        fill: #94A3B8;
      }
    </style>
  </defs>

  <!-- Symbol: Symmetrical 2x2 Window Formation -->
  <g id="giri-symbol" transform="translate(35, 30)">
    <rect x="0" y="0" width="64" height="64" rx="10" fill="#00D2FF" />
    <rect x="76" y="0" width="64" height="64" rx="10" fill="#0066FF" />
    <rect x="0" y="76" width="64" height="64" rx="10" fill="#7928CA" />
    <rect x="76" y="76" width="64" height="64" rx="10" fill="#A855F7" />
  </g>

  <!-- Wordmark Section for Dark Backgrounds -->
  <g transform="translate(225, 0)">
    <text x="0" y="112" class="brand-text">
      GIRI <tspan fill="#00D2FF">OS</tspan>
    </text>
    <rect x="2" y="132" width="460" height="2" rx="1" fill="#00D2FF" opacity="0.6" />
    <text x="3" y="156" class="tagline-text">ONE SYSTEM. INFINITE POSSIBILITIES.</text>
  </g>
</svg>
