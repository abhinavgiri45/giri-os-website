<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <!-- GIRI OS — Official Vector Logo (Transparent Master) -->
  <defs>
    <!-- Primary Gradients -->
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00A8FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <linearGradient id="cosmicViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C77DFF" />
      <stop offset="50%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#5A189A" />
    </linearGradient>

    <linearGradient id="orbitalGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#9D4EDD" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="85%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Filter Effects -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0066FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Space Grotesk", "Inter", "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 78px;
      letter-spacing: 6px;
    }
    .brand-tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: 8px;
      fill: #475569;
    }
    .orbit-ring {
      fill: none;
      stroke-linecap: round;
    }
  </style>

  <!-- LOGO EMBLEM GROUP -->
  <g transform="translate(40, 20)">
    <!-- Ambient Internal Glow -->
    <circle cx="140" cy="140" r="110" fill="url(#cosmicViolet)" opacity="0.12" filter="url(#neonGlow)" />
    <circle cx="140" cy="140" r="80" fill="url(#electricBlue)" opacity="0.08" filter="url(#neonGlow)" />

    <!-- Outer Orbital Ring Path -->
    <g transform="rotate(-28 140 140)">
      <ellipse cx="140" cy="140" rx="120" ry="42" class="orbit-ring" stroke="url(#orbitalGlow)" stroke-width="3.5" stroke-dasharray="240 18 40 12" filter="url(#softShadow)" />
      <!-- Orbital Satellite Node -->
      <circle cx="260" cy="140" r="5.5" fill="#00F0FF" filter="url(#neonGlow)" />
      <circle cx="260" cy="140" r="2.5" fill="#FFFFFF" />
    </g>

    <!-- Secondary Counter Orbital Accent -->
    <g transform="rotate(45 140 140)">
      <ellipse cx="140" cy="140" rx="98" ry="32" class="orbit-ring" stroke="#9D4EDD" stroke-width="1.8" stroke-dasharray="140 30" opacity="0.45" />
      <circle cx="42" cy="140" r="3.5" fill="#C77DFF" />
    </g>

    <!-- Core Geometric 'G' Body -->
    <path d="M 210,105 
             C 192,68 152,48 112,54 
             C 65,61 32,103 32,150 
             C 32,201 70,238 124,238 
             C 178,238 216,202 216,155 
             L 216,142 
             L 126,142 
             L 126,168 
             L 186,168 
             C 183,188 158,210 124,210 
             C 86,210 59,182 59,147 
             C 59,112 84,83 121,79 
             C 148,76 174,88 188,110 
             Z" 
          fill="url(#electricBlue)" 
          filter="url(#softShadow)" />

    <!-- Geometric Inner Violet Intersecting Core -->
    <path d="M 126,142 L 186,142 L 186,168 L 126,168 Z" fill="url(#cosmicViolet)" opacity="0.9" />

    <!-- Forefront Orbital Arc crossing in front of the 'G' -->
    <g transform="rotate(-28 140 140)">
      <path d="M 80,172 C 110,184 170,184 210,170" class="orbit-ring" stroke="#00F0FF" stroke-width="4.2" filter="url(#neonGlow)" />
    </g>
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g transform="translate(340, 95)">
    <!-- Main Title: GIRI OS -->
    <text x="0" y="65" class="brand-title" fill="url(#textGrad)">GIRI <tspan fill="#0066FF">OS</tspan></text>
    
    <!-- Accent Line -->
    <rect x="2" y="90" width="220" height="3" rx="1.5" fill="url(#orbitalGlow)" />
    <circle cx="228" cy="91.5" r="3" fill="#0066FF" />

    <!-- Tagline: ONE SYSTEM. INFINITE POSSIBILITIES. -->
    <text x="3" y="130" class="brand-tagline">ONE SYSTEM. INFINITE POSSIBILITIES.</text>

    <!-- Sub-badge: DEBIAN FOUNDATION -->
    <g transform="translate(4, 155)">
      <rect width="185" height="24" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <circle cx="14" cy="12" r="4" fill="#0066FF" />
      <text x="26" y="16.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#2563EB" letter-spacing="1.5">DEBIAN EDITION 0.1</text>
    </g>
  </g>
</svg>
