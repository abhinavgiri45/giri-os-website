<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <!-- GIRI OS — Official Vector Logo (Dark Background Optimized) -->
  <defs>
    <linearGradient id="electricBlueDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00A8FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <linearGradient id="cosmicVioletDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C77DFF" />
      <stop offset="50%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#5A189A" />
    </linearGradient>

    <linearGradient id="orbitalGlowDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#9D4EDD" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0.1" />
    </linearGradient>

    <filter id="neonGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .brand-title-dark {
      font-family: -apple-system, BlinkMacSystemFont, "Space Grotesk", "Inter", "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 78px;
      letter-spacing: 6px;
      fill: #FFFFFF;
    }
    .brand-tagline-dark {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: 8px;
      fill: #94A3B8;
    }
  </style>

  <!-- LOGO EMBLEM GROUP -->
  <g transform="translate(40, 20)">
    <circle cx="140" cy="140" r="110" fill="url(#cosmicVioletDark)" opacity="0.16" filter="url(#neonGlowDark)" />
    <circle cx="140" cy="140" r="80" fill="url(#electricBlueDark)" opacity="0.10" filter="url(#neonGlowDark)" />

    <g transform="rotate(-28 140 140)">
      <ellipse cx="140" cy="140" rx="120" ry="42" fill="none" stroke="url(#orbitalGlowDark)" stroke-width="3.5" stroke-dasharray="240 18 40 12" />
      <circle cx="260" cy="140" r="5.5" fill="#00F0FF" filter="url(#neonGlowDark)" />
      <circle cx="260" cy="140" r="2.5" fill="#FFFFFF" />
    </g>

    <g transform="rotate(45 140 140)">
      <ellipse cx="140" cy="140" rx="98" ry="32" fill="none" stroke="#9D4EDD" stroke-width="1.8" stroke-dasharray="140 30" opacity="0.45" />
      <circle cx="42" cy="140" r="3.5" fill="#C77DFF" />
    </g>

    <path d="M 210,105 
             C 192,68 152,48 112,54 
             C 65,61 32,103 32,150 
             C 32,201 70,238 124,238 
             C 178,238 216,202 216,155 
             L 216,142 
             L 126,142 
             L 126,168 
             L 186,168 
             C 183,188 158,210 124,210 
             C 86,210 59,182 59,147 
             C 59,112 84,83 121,79 
             C 148,76 174,88 188,110 
             Z" 
          fill="url(#electricBlueDark)" />

    <path d="M 126,142 L 186,142 L 186,168 L 126,168 Z" fill="url(#cosmicVioletDark)" opacity="0.9" />

    <g transform="rotate(-28 140 140)">
      <path d="M 80,172 C 110,184 170,184 210,170" fill="none" stroke="#00F0FF" stroke-width="4.2" filter="url(#neonGlowDark)" />
    </g>
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g transform="translate(340, 95)">
    <text x="0" y="65" class="brand-title-dark">GIRI <tspan fill="#00F0FF">OS</tspan></text>
    <rect x="2" y="90" width="220" height="3" rx="1.5" fill="url(#orbitalGlowDark)" />
    <circle cx="228" cy="91.5" r="3" fill="#00F0FF" />
    <text x="3" y="130" class="brand-tagline-dark">ONE SYSTEM. INFINITE POSSIBILITIES.</text>
    <g transform="translate(4, 155)">
      <rect width="185" height="24" rx="6" fill="#141E33" stroke="#253556" stroke-width="1" />
      <circle cx="14" cy="12" r="4" fill="#00F0FF" />
      <text x="26" y="16.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#7E93B5" letter-spacing="1.5">DEBIAN EDITION 0.1</text>
    </g>
  </g>
</svg>
