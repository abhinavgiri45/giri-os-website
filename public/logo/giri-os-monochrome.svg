<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="100%" height="100%">
  <!-- GIRI OS — Single-Colour Monochrome Version -->
  <!-- Symmetrical 2x2 Window Formation & Typography in Solid Monotone -->
  <defs>
    <style>
      .mono-text {
        font-family: "Inter", "Space Grotesk", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 800;
        font-size: 72px;
        letter-spacing: 5px;
        fill: #000000;
      }
      .mono-tagline {
        font-family: "Inter", "Space Grotesk", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 600;
        font-size: 13.5px;
        letter-spacing: 5.5px;
        fill: #000000;
      }
    </style>
  </defs>

  <!-- Symbol: Symmetrical 2x2 Window Formation -->
  <g id="giri-symbol-mono" transform="translate(35, 30)" fill="#000000">
    <rect x="0" y="0" width="64" height="64" rx="10" />
    <rect x="76" y="0" width="64" height="64" rx="10" />
    <rect x="0" y="76" width="64" height="64" rx="10" />
    <rect x="76" y="76" width="64" height="64" rx="10" />
  </g>

  <!-- Wordmark Section -->
  <g transform="translate(225, 0)">
    <text x="0" y="112" class="mono-text">GIRI OS</text>
    <rect x="2" y="132" width="460" height="2" fill="#000000" />
    <text x="3" y="156" class="mono-tagline">ONE SYSTEM. INFINITE POSSIBILITIES.</text>
  </g>
</svg>
